name: Exact-source noisy-marker verification

on:
  pull_request:
    paths:
      - '.github/workflows/noisy-marker-verification.yml'

permissions:
  contents: read

concurrency:
  group: exact-noisy-marker-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CAPTURE_REVISION: 63274d0d6f6fc32addd9f5b975e7d2fc1185c416
      CAPTURE_TREE: 640465b8f96069798d3cb2c29a6358d17db05438
    steps:
      - name: Check out the exact proposed source
        id: source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CAPTURE_REVISION }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.5'
      - name: Install the capture runtime
        run: |
          test "$(git rev-parse HEAD)" = "$CAPTURE_REVISION"
          test "$(git rev-parse HEAD^{tree})" = "$CAPTURE_TREE"
          npm install --fetch-retries=1 --fetch-timeout=40000 --prefix "$RUNNER_TEMP/math-runtime" playwright@1.56.1 mathjax-full@3.2.1
          node "$RUNNER_TEMP/math-runtime/node_modules/playwright/cli.js" install --only-shell chromium
      - name: Compare the complete hosted Markdown inventory
        run: |
          export NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules"
          node verification/hosted_math/run_hosted_math.cjs capture \
            --root "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
            --revision "$CAPTURE_REVISION" --output "$RUNNER_TEMP/hosted-math"
      - name: Run the existing scientific and navigation checks
        if: always() && steps.source.outcome == 'success'
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python3 -m venv "$RUNNER_TEMP/science-runtime"
          "$RUNNER_TEMP/science-runtime/bin/python" -m pip install -r verification/requirements.txt
          "$RUNNER_TEMP/science-runtime/bin/python" verification/check_science.py --output "$RUNNER_TEMP/science-checks.json"
          "$RUNNER_TEMP/science-runtime/bin/python" verification/check_repository.py --output "$RUNNER_TEMP/repository-checks.json"
      - name: Retain actual reports and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exact-hosted-${{ env.CAPTURE_REVISION }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hosted-math
            ${{ runner.temp }}/science-checks.json
            ${{ runner.temp }}/repository-checks.json
          if-no-files-found: error
          retention-days: 14
